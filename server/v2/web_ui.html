<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerovskiteGPT-钙钛矿专家</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; overflow: hidden; }
        
        /* ---- sidebar ---- */
        .sidebar { width: 280px; min-width: 280px; background: #1e2a3a; color: #ccc; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #2a3a4a; }
        .sidebar-header h2 { font-size: 1.1rem; color: #fff; margin-bottom: 12px; }
        .sidebar-header button { width: 100%; background: #4CAF50; color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 0.9rem; cursor: pointer; transition: background 0.2s; }
        .sidebar-header button:hover { background: #45a049; }
        .session-list { flex: 1; overflow-y: auto; padding: 8px; }
        .session-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.15s; word-break: break-all; font-size: 0.85rem; }
        .session-item:hover { background: #2a3a4a; }
        .session-item.active { background: #007aff; color: #fff; }
        .session-item .title { font-weight: 600; margin-bottom: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-right: 48px; }
        .session-item.active .preview { color: #cce5ff; }
        .sidebar-footer { padding: 12px 20px; border-top: 1px solid #2a3a4a; font-size: 0.75rem; color: #666; text-align: center; }
        .session-item { position: relative; }
        .session-actions { display: none; position: absolute; right: 8px; top: 8px; gap: 4px; }
        .session-item:hover .session-actions { display: flex; }
        .session-actions button { background: none; border: none; cursor: pointer; font-size: 0.75rem; padding: 2px 4px; border-radius: 4px; color: #999; }
        .session-actions button:hover { background: rgba(255,255,255,0.15); }
        .session-item.active .session-actions button { color: #cce5ff; }
        .rename-input { width: 100%; background: #2a3a4a; border: 1px solid #007aff; border-radius: 4px; color: #fff; padding: 4px 8px; font-size: 0.85rem; outline: none; }
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: #555; padding: 40px; text-align: center; gap: 20px; }
        .welcome-screen .logo { font-size: 3rem; font-weight: 700; color: #2c3e50; letter-spacing: 2px; }
        .welcome-screen .logo span { color: #007aff; }
        .welcome-screen p { font-size: 0.95rem; color: #888; max-width: 400px; line-height: 1.6; }
        .welcome-screen .examples { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
        .welcome-screen .examples button { background: #e9ecef; color: #555; border: 1px solid #dee2e6; border-radius: 20px; padding: 8px 18px; font-size: 0.85rem; cursor: pointer; transition: all 0.15s; }
        .welcome-screen .examples button:hover { background: #d0d4d9; border-color: #adb5bd; }
        .welcome-screen .input-area-welcome { width: 100%; max-width: 600px; display: flex; gap: 12px; align-items: center; margin-top: 8px; }
        .welcome-screen .input-area-welcome textarea { flex: 1; padding: 12px 20px; border: 1px solid #ced4da; border-radius: 28px; font-family: inherit; font-size: 1rem; resize: none; outline: none; max-height: 120px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .welcome-screen .input-area-welcome textarea:focus { border-color: #007aff; box-shadow: 0 2px 12px rgba(0,122,255,0.15); }
        .welcome-screen .input-area-welcome button { background: #007aff; color: white; border: none; border-radius: 40px; padding: 12px 32px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        .welcome-screen .input-area-welcome button:hover { background: #005fc1; }

        /* ---- main chat ---- */
        .main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .chat-container { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .chat-header { background: #2c3e50; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
        .chat-header h1 { margin: 0; font-size: 1.3rem; cursor: pointer; }
        .chat-header .subtitle { font-size: 0.8rem; color: #aaa; }
        .messages-area { flex: 1; overflow-y: auto; padding: 20px; background: #f9f9fc; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
        .message { display: flex; flex-direction: column; position: relative; overflow: visible; }
        .message-body { display: flex; align-items: flex-start; gap: 0; max-width: 1080px; }
        .user-message .message-body { flex-direction: row-reverse; align-self: flex-end; }
        .assistant-message .message-body { align-self: flex-start; }
        .bubble-wrapper { display: flex; flex-direction: column; min-width: 0; flex: 0 1 auto; max-width: 1080px; position: relative; }
        .msg-actions { position: absolute; opacity: 0; transition: opacity 0.15s; bottom: 2px; }
        .message:hover .msg-actions { opacity: 1; }
        .msg-actions button { background: none; border: none; cursor: pointer; font-size: 0.75rem; padding: 2px; color: #aaa; line-height: 1; border-radius: 4px; }
        .msg-actions button:hover { color: #e74c3c; background: rgba(0,0,0,0.05); }
        .assistant-message .bubble-wrapper .msg-actions { right: -22px; }
        .user-message .bubble-wrapper .msg-actions { left: -22px; }
        .user-message { align-items: flex-end; }
        .assistant-message { align-items: flex-start; }
        .bubble { max-width: 100%; padding: 12px 18px; border-radius: 20px; line-height: 1.6; word-wrap: break-word; overflow-wrap: break-word; white-space: pre-wrap; }
        .user-bubble { background: #007aff; color: white; border-bottom-right-radius: 4px; }
        .assistant-bubble { background: #e9ecef; color: #1e2a3a; border-bottom-left-radius: 4px; }
        .sources { font-size: 0.75rem; color: #6c757d; margin-top: 6px; max-width: 80%; }
        .input-area { padding: 16px 24px; background: white; border-top: 1px solid #dee2e6; display: flex; gap: 12px; align-items: center; }
        textarea { flex: 1; padding: 12px 16px; border: 1px solid #ced4da; border-radius: 28px; font-family: inherit; font-size: 1rem; resize: none; outline: none; max-height: 120px; }
        textarea:focus { border-color: #007aff; }
        .input-area button { background: #007aff; color: white; border: none; border-radius: 40px; padding: 10px 28px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        .input-area button:hover { background: #005fc1; }
        .input-area button:disabled { background: #86b7fe; cursor: not-allowed; }
        .input-area .stop-btn { background: #e74c3c; }
        .input-area .stop-btn:hover { background: #c0392b; }
        .loading { display: flex; align-items: center; gap: 8px; color: #007aff; font-style: italic; margin-top: 8px; }
        .spinner { width: 16px; height: 16px; border: 2px solid #e9ecef; border-top-color: #007aff; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; color: #aaa; padding: 20px; }
        .cursor-blink::after { content: '\258A'; animation: blink 0.8s step-end infinite; color: #007aff; }
        @keyframes blink { 50% { opacity: 0; } }
        /* ── Markdown rendering ── */
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin: 16px 0 8px; }
        .markdown-content h2 { font-size: 1.15rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        .markdown-content h3 { font-size: 1.05rem; }
        .markdown-content p { margin: 6px 0; }
        .markdown-content ul, .markdown-content ol { margin: 6px 0; padding-left: 24px; }
        .markdown-content li { margin: 3px 0; }
        .markdown-content strong { font-weight: 700; }
        .markdown-content code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: 'Cascadia Code', 'Fira Code', monospace; }
        .markdown-content pre { background: #1e2a3a; color: #e9ecef; padding: 14px 18px; border-radius: 10px; overflow-x: auto; margin: 10px 0; font-size: 0.88rem; }
        .markdown-content pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
        .markdown-content table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 0.9rem; }
        .markdown-content th, .markdown-content td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        .markdown-content th { background: #f0f2f5; font-weight: 600; }
        .markdown-content tr:nth-child(even) { background: #fafafa; }
        .markdown-content blockquote { border-left: 4px solid #007aff; padding: 6px 14px; margin: 8px 0; color: #555; background: #f8f9fa; border-radius: 0 8px 8px 0; }
        .markdown-content hr { border: none; border-top: 1px solid #ddd; margin: 16px 0; }
        .markdown-content a { color: #007aff; text-decoration: none; }
        .markdown-content a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>&#128172; History</h2>
        <button id="newChatBtn">&#10133; New Chat</button>
    </div>
    <div class="session-list" id="sessionList">
        <div class="empty-state">No conversations yet</div>
    </div>
    <div class="sidebar-footer">PerovskiteGPT v2 &middot; Agentic RAG</div>
</div>

<div class="main">
<div class="chat-container">
    <div class="chat-header">
        <h1 onclick="showWelcome()"><img src="/static/logo.webp" style="height:32px;vertical-align:middle;margin-right:8px" alt="">PerovskiteGPT</h1>
        <div class="subtitle">Perovskite Solar Cells &middot; Materials Science &middot; Optoelectronics</div>
    </div>
    <div id="welcomeScreen" class="welcome-screen" style="display:none">
        <div class="logo">Perovskite<span>GPT</span></div>
        <p>Perovskite Solar Cells &middot; Materials Science &middot; Optoelectronics<br>Agentic RAG for perovskite research</p>
        <div class="examples">
            <button onclick="quickAsk('Explain the basic structure of a perovskite solar cell')">PSC Structure</button>
            <button onclick="quickAsk('What are the main defect types in perovskites?')">Defect Types</button>
            <button onclick="quickAsk('How to improve perovskite solar cell stability?')">Stability</button>
        </div>
        <div class="input-area-welcome">
            <textarea id="welcomeInput" rows="1" placeholder="Ask a question..." style="height:auto"></textarea>
            <button onclick="sendFromWelcome()">Send</button>
        </div>
    </div>
    <div class="messages-area" id="messagesArea" style="display:none"></div>
    <div class="input-area" id="inputArea">
        <textarea id="questionInput" rows="1" placeholder="Ask a question... (Ctrl+Enter to send)"></textarea>
        <button id="sendBtn" style="display:none">Send</button>
        <button id="stopBtn" class="stop-btn" style="display:none">&#9209; Stop</button>
    </div>
</div>
</div>

<script>
    let currentSessionId = localStorage.getItem('perovskite_session_id');
    let allSessions = {};
    const MAX_VISIBLE_TURNS = 10;
    let abortController = null;

    function generateSessionId() {
        return 'session_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    }

    async function loadSessionList() {
        try {
            const resp = await fetch('/sessions');
            const data = await resp.json();
            const tempSessions = {};
            Object.keys(allSessions).forEach(k => { if (allSessions[k]._temp) tempSessions[k] = allSessions[k]; });
            allSessions = tempSessions;
            (data.sessions || []).forEach(s => { allSessions[s.session_id] = s; });
            renderSessionList();
        } catch(e) { console.log('loadSessionList error', e); }
    }

    function renderSessionList() {
        const list = document.getElementById('sessionList');
        const ids = Object.keys(allSessions);
        if (ids.length === 0) {
            list.innerHTML = '<div class="empty-state">No conversations yet</div>';
            return;
        }
        ids.sort((a, b) => (allSessions[b].last_accessed || 0) - (allSessions[a].last_accessed || 0));
        list.innerHTML = ids.map(id => {
            const s = allSessions[id];
            const title = s.title || (s.history && s.history[0] ? s.history[0].question.substring(0,40) : 'New Chat');
            const isActive = id === currentSessionId ? 'active' : '';
            return '<div class="session-item ' + isActive + '" data-session="' + id + '">' +
                '<div class="title">' + escapeHtml(title) + '</div>' +
                '<div class="session-actions">' +
                    '<button onclick="event.stopPropagation();renameSession(\'' + id + '\')" title="Rename">&#9998;</button>' +
                    '<button onclick="event.stopPropagation();deleteSession(\'' + id + '\')" title="Delete">&#128465;</button>' +
                '</div></div>';
        }).join('');
        document.querySelectorAll('.session-item').forEach(el => {
            el.addEventListener('click', function() { switchSession(this.dataset.session); });
        });
    }

    async function renameSession(sessionId) {
        const item = document.querySelector('.session-item[data-session="' + sessionId + '"]');
        if (!item) return;
        const ad = item.querySelector('.session-actions');
        if (ad) ad.style.display = 'none';
        const td = item.querySelector('.title');
        const oldTitle = td.textContent;
        const inp = document.createElement('input');
        inp.className = 'rename-input'; inp.value = oldTitle; inp.autofocus = true;
        td.innerHTML = ''; td.appendChild(inp); inp.focus(); inp.select();
        const finish = async () => {
            const nt = inp.value.trim() || oldTitle;
            try { await fetch('/session/' + sessionId + '/rename', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:nt}) }); if (allSessions[sessionId]) allSessions[sessionId].title = nt; } catch(e) {}
            renderSessionList();
        };
        inp.addEventListener('blur', finish);
        inp.addEventListener('keydown', e => { if (e.key==='Enter'||e.key==='Escape') { e.preventDefault(); inp.blur(); } });
    }

    async function deleteSession(sessionId) {
        if (!confirm('Delete this conversation?')) return;
        try { await fetch('/session/' + sessionId, { method:'DELETE' }); delete allSessions[sessionId]; if (sessionId===currentSessionId) showWelcome(); renderSessionList(); } catch(e) {}
    }

    async function switchSession(sessionId) {
        if (sessionId===currentSessionId) return;
        currentSessionId = sessionId;
        localStorage.setItem('perovskite_session_id', sessionId);
        hideWelcome(); loadSessionList(); await loadMessages(sessionId);
    }

    async function loadMessages(sessionId) {
        const area = document.getElementById('messagesArea');
        area.style.display = 'flex';
        area.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading...</span></div>';
        try {
            const resp = await fetch('/session/' + sessionId + '/history');
            const data = await resp.json();
            area.innerHTML = '';
            if (data.history && data.history.length > 0) {
                const total = data.history.length;
                const showCount = Math.min(total, MAX_VISIBLE_TURNS);
                const hiddenCount = total - showCount;
                const si = total - showCount;
                if (hiddenCount > 0) {
                    const ed = document.createElement('div'); ed.style.textAlign = 'center'; ed.style.margin = '12px 0';
                    const btn = document.createElement('button');
                    btn.textContent = 'Show ' + hiddenCount + ' earlier rounds';
                    btn.style.cssText = 'background:#6c757d;padding:8px 20px;font-size:0.85rem;color:#fff;border:none;border-radius:8px;cursor:pointer';
                    btn.onclick = function() {
                        area.innerHTML = '';
                        for (let i=0; i<total; i++) { const t = data.history[i]; addMessage('user', t.question, [], false); addMessage('assistant', t.answer, t.sources||[], false); }
                        area.scrollTop = area.scrollHeight;
                    };
                    ed.appendChild(btn); area.appendChild(ed);
                }
                for (let i=si; i<total; i++) { const t = data.history[i]; addMessage('user', t.question, [], false); addMessage('assistant', t.answer, t.sources||[], false); }
            } else {
                area.innerHTML = '<div class="message assistant-message"><div class="bubble assistant-bubble">This conversation is empty. Start asking!</div></div>';
            }
            area.scrollTop = area.scrollHeight;
            showSendButton();
        } catch(e) {
            area.innerHTML = '<div class="message assistant-message"><div class="bubble assistant-bubble">Failed to load: ' + e.message + '</div></div>';
            showSendButton();
        }
    }

    function showWelcome() {
        stopGeneration();
        document.getElementById('messagesArea').style.display = 'none';
        document.getElementById('welcomeScreen').style.display = 'flex';
        document.getElementById('inputArea').style.display = 'none';
    }
    function hideWelcome() {
        document.getElementById('messagesArea').style.display = 'flex';
        document.getElementById('welcomeScreen').style.display = 'none';
        document.getElementById('inputArea').style.display = 'flex';
    }
    function newChat() { showWelcome(); }

    function quickAsk(q) {
        currentSessionId = generateSessionId();
        localStorage.setItem('perovskite_session_id', currentSessionId);
        document.getElementById('messagesArea').innerHTML = '';
        createTempSession(); hideWelcome(); showSendButton(); loadSessionList();
        setTimeout(() => { document.getElementById('questionInput').value = q; sendQuestion(); }, 100);
    }

    document.getElementById('newChatBtn').addEventListener('click', newChat);
    const questionInput = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const messagesArea = document.getElementById('messagesArea');

    function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(120,el.scrollHeight)+'px'; }
    questionInput.addEventListener('input', function(){autoResize(this);});
    document.addEventListener('DOMContentLoaded', function(){const wi=document.getElementById('welcomeInput'); if(wi) wi.addEventListener('input',function(){autoResize(this);});});

    function handleKeydown(e) {
        if ((e.ctrlKey&&e.key==='Enter')||(e.key==='Enter'&&!e.shiftKey)) { e.preventDefault(); sendQuestion(); }
    }
    questionInput.addEventListener('keydown', handleKeydown);
    setTimeout(()=>{const wi=document.getElementById('welcomeInput'); if(wi) wi.addEventListener('keydown',handleKeydown);},0);

    sendBtn.addEventListener('click', sendQuestion);
    stopBtn.addEventListener('click', stopGeneration);
    function showSendButton() { sendBtn.style.display=''; stopBtn.style.display='none'; }
    function showStopButton() { sendBtn.style.display='none'; stopBtn.style.display=''; }

    function sendFromWelcome() {
        const wi=document.getElementById('welcomeInput');
        const q=wi.value.trim(); if(!q) return;
        wi.value='';
        currentSessionId=generateSessionId();
        localStorage.setItem('perovskite_session_id',currentSessionId);
        document.getElementById('messagesArea').innerHTML='';
        createTempSession(); hideWelcome(); showSendButton(); loadSessionList();
        questionInput.value=q; autoResize(questionInput); sendQuestion();
    }

    function stopGeneration() {
        if (abortController) { abortController.abort(); abortController=null; }
        showSendButton();
        const ce=document.querySelector('.cursor-blink'); if(ce) ce.classList.remove('cursor-blink');
    }

    function createTempSession() {
        allSessions[currentSessionId]={session_id:currentSessionId,last_accessed:Date.now()/1000,title:'New Chat',history:[],_temp:true};
        renderSessionList();
    }

    async function sendQuestion() {
        let input = (document.getElementById('welcomeScreen').style.display!=='none') ? document.getElementById('welcomeInput') : questionInput;
        const question = input.value.trim(); if(!question) return;
        input.value=''; autoResize(input);

        const ws = document.getElementById('welcomeScreen');
        if (ws.style.display!=='none') {
            currentSessionId=generateSessionId();
            localStorage.setItem('perovskite_session_id',currentSessionId);
            document.getElementById('messagesArea').innerHTML='';
            createTempSession(); hideWelcome(); showSendButton(); loadSessionList();
        }

        addMessage('user', question);
        showStopButton();

        const msgDiv=document.createElement('div');
        msgDiv.className='message assistant-message';
        const bodyDiv=document.createElement('div'); bodyDiv.className='message-body';
        const wd=document.createElement('div'); wd.className='bubble-wrapper';
        const bubble=document.createElement('div'); bubble.className='bubble assistant-bubble'; bubble.classList.add('cursor-blink');
        wd.appendChild(bubble);
        const act=document.createElement('div'); act.className='msg-actions';
        const db=document.createElement('button'); db.textContent='\uD83D\uDDD1'; db.title='Delete';
        db.onclick=function(e){e.stopPropagation();msgDiv.remove();};
        act.appendChild(db); wd.appendChild(act); bodyDiv.appendChild(wd); msgDiv.appendChild(bodyDiv);
        const sc=document.createElement('div'); sc.style.cssText='max-width:80%;margin-top:6px;display:none';
        msgDiv.appendChild(sc);
        messagesArea.appendChild(msgDiv);
        messagesArea.scrollTop=messagesArea.scrollHeight;

        abortController = new AbortController();
        try {
            const resp = await fetch('/ask/stream', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({question:question, session_id:currentSessionId}),
                signal:abortController.signal
            });
            if (!resp.ok) throw new Error('HTTP '+resp.status);
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buf='', fullAnswer='', recSources=[];
            while(true) {
                const {done,value}=await reader.read();
                if(done) break;
                buf+=decoder.decode(value,{stream:true});
                const lines=buf.split('\n');
                buf=lines.pop()||'';
                for(const line of lines) {
                    if(!line.startsWith('data: ')) continue;
                    try {
                        const d=JSON.parse(line.slice(6));
                        if(d.type==='chunk') { fullAnswer+=d.text; bubble.innerHTML=marked.parse(fullAnswer); bubble.className='bubble assistant-bubble markdown-content'; messagesArea.scrollTop=messagesArea.scrollHeight; }
                        else if(d.type==='sources') recSources=d.sources;
                        else if(d.type==='done') {
                            if(d.session_id) { currentSessionId=d.session_id; localStorage.setItem('perovskite_session_id',currentSessionId); }
                            if(recSources.length>0) {
                                sc.style.display='';
                                const toggle=document.createElement('span');
                                toggle.style.cssText='font-size:0.75rem;color:#007aff;cursor:pointer;user-select:none;';
                                toggle.textContent='\uD83D\uDCDA Sources ('+recSources.length+')';
                                const sd=document.createElement('div'); sd.className='sources'; sd.style.display='none';
                                sd.innerHTML=recSources.map((s,i)=>'<span style="font-weight:600;color:#007aff">['+(i+1)+']</span> '+escapeHtml(s.substring(0,200))).join('<br>');
                                let expanded=false;
                                toggle.onclick=function(){expanded=!expanded;sd.style.display=expanded?'block':'none';toggle.textContent=expanded?'\uD83D\uDCDA Collapse sources':'\uD83D\uDCDA Sources ('+recSources.length+')';};
                                sc.appendChild(toggle); sc.appendChild(sd);
                            }
                            bubble.classList.remove('cursor-blink');
                            loadSessionList();
                        } else if(d.type==='error') { bubble.classList.remove('cursor-blink'); bubble.innerHTML='<span style="color:#e74c3c">Error: '+escapeHtml(d.text)+'</span>'; }
                    } catch(e) {}
                }
            }
        } catch(error) {
            if(error.name==='AbortError') bubble.innerHTML=(bubble.textContent||'')+'<br><span style="color:#999;font-style:italic;font-size:0.85rem">\u23F1 Stopped</span>';
            else bubble.innerHTML='<span style="color:#e74c3c">Request failed: '+escapeHtml(error.message)+'</span>';
        } finally {
            abortController=null; showSendButton(); bubble.classList.remove('cursor-blink');
        }
    }

    function addMessage(role, text, sources, scroll) {
        if(!sources) sources=[]; if(scroll===undefined) scroll=true;
        const md=document.createElement('div');
        md.className='message '+(role==='user'?'user-message':'assistant-message');
        const bd=document.createElement('div'); bd.className='message-body';
        const wd=document.createElement('div'); wd.className='bubble-wrapper';
        const bb=document.createElement('div'); bb.className='bubble '+(role==='user'?'user-bubble':'assistant-bubble');
        if (role==='assistant') { bb.innerHTML=marked.parse(text); bb.className='bubble assistant-bubble markdown-content'; } else { bb.innerHTML=text.replace(/\n/g,'<br>'); }
        wd.appendChild(bb);
        const act=document.createElement('div'); act.className='msg-actions';
        const db=document.createElement('button'); db.textContent='\uD83D\uDDD1'; db.title='Delete';
        db.onclick=function(e){e.stopPropagation();md.remove();};
        act.appendChild(db); wd.appendChild(act); bd.appendChild(wd); md.appendChild(bd);
        if(role==='assistant'&&sources.length>0) {
            const c=document.createElement('div'); c.style.cssText='max-width:80%;margin-top:6px';
            const toggle=document.createElement('span');
            toggle.style.cssText='font-size:0.75rem;color:#007aff;cursor:pointer;user-select:none;';
            toggle.textContent='\uD83D\uDCDA Sources ('+sources.length+')';
            const sd=document.createElement('div'); sd.className='sources'; sd.style.display='none';
            sd.innerHTML=sources.map((s,i)=>'<span style="font-weight:600;color:#007aff">['+(i+1)+']</span> '+escapeHtml(s.substring(0,200))).join('<br>');
            let expanded=false;
            toggle.onclick=function(){expanded=!expanded;sd.style.display=expanded?'block':'none';toggle.textContent=expanded?'\uD83D\uDCDA Collapse sources':'\uD83D\uDCDA Sources ('+sources.length+')';};
            c.appendChild(toggle); c.appendChild(sd); md.appendChild(c);
        }
        messagesArea.appendChild(md);
        if(scroll) messagesArea.scrollTop=messagesArea.scrollHeight;
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m==='&') return '&amp;';
            if(m==='<') return '&lt;';
            if(m==='>') return '&gt;';
            return m;
        });
    }

    (async function init() {
        await loadSessionList();
        if(currentSessionId && allSessions[currentSessionId]) { hideWelcome(); await loadMessages(currentSessionId); renderSessionList(); }
        else if(Object.keys(allSessions).length>0) {
            const ids=Object.keys(allSessions); ids.sort((a,b)=>(allSessions[b].last_accessed||0)-(allSessions[a].last_accessed||0));
            currentSessionId=ids[0]; localStorage.setItem('perovskite_session_id',currentSessionId);
            hideWelcome(); await loadMessages(currentSessionId); renderSessionList();
        } else { showWelcome(); }
    })();
</script>
</body>
</html>
