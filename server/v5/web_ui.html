<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny · 钙钛矿科研助手</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@350;400;500;530&family=JetBrains+Mono:wght@400;450&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   Sunny RAG · Quiet Laboratory
   ═══════════════════════════════════════════════ */

:root {
  --bg:       #0d1117;
  --bg2:      #12161d;
  --surface:  #161b22;
  --border:   #21262d;
  --border2:  #30363d;
  --text:     #c9d1d9;
  --text2:    #8b949e;
  --text3:    #5c6370;
  --accent:   #d2a85c;
  --link:     #79b8ff;
  --think:    #8b949e;
  --tool:     #b3925c;
  --err:      #f85149;
}

* { box-sizing: border-box; margin: 0; padding: 0 }
html, body {
  height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 350;
  background: var(--bg);
  color: var(--text);
  color-scheme: dark;
  -webkit-font-smoothing: antialiased;
}
body { display: flex; overflow: hidden }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px }
::-webkit-scrollbar-track { background: transparent }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px }
::-webkit-scrollbar-thumb:hover { background: var(--text3) }

/* ── Sidebar ── */
nav {
  width: 240px; min-width: 240px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  font-size: .82rem;
}
nav header {
  padding: 22px 18px 14px;
  border-bottom: 1px solid var(--border);
}
nav header .brand {
  font-size: .92rem; font-weight: 530; color: var(--text);
  margin-bottom: 14px; letter-spacing: -.2px;
}
nav header .brand i { color: var(--accent); font-style: normal }
nav header button {
  background: none; border: 1px solid var(--border2); color: var(--text2);
  padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: .78rem;
  font-family: inherit; font-weight: 400; width: 100%; text-align: left;
  transition: all .15s; margin-bottom: 4px;
}
nav header button:hover { background: var(--surface); color: var(--text); border-color: var(--text3) }
nav .sessions { flex: 1; overflow-y: auto; padding: 8px 10px }
nav .sessions .item {
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
  margin-bottom: 2px; color: var(--text2); transition: all .12s;
  display: flex; align-items: center; justify-content: space-between;
  font-size: .8rem; border: 1px solid transparent;
}
nav .sessions .item:hover { background: rgba(255,255,255,.02); color: var(--text) }
nav .sessions .item.on { background: rgba(210,168,92,.2); color: var(--text); border-color: rgba(210,168,92,.5); font-weight: 500; box-shadow: inset 3px 0 0 var(--accent) }
nav .sessions .item .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis }
nav .sessions .item .acts { display: none; gap: 2px; flex-shrink: 0; margin-left: 6px }
nav .sessions .item:hover .acts { display: flex }
nav .sessions .item .acts button {
  background: none; border: none; cursor: pointer; padding: 3px 5px;
  font-size: .65rem; border-radius: 4px; color: var(--text3);
}
nav .sessions .item .acts button:hover { background: rgba(255,255,255,.06); color: var(--text) }
nav footer { padding: 10px 18px; border-top: 1px solid var(--border); font-size: .68rem; color: var(--text3) }

/* ── Main ── */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative }

/* ── Chat ── */
.chat-header {
  padding: 16px 32px; border-bottom: 1px solid var(--border);
  font-size: .82rem; color: var(--text3); display: flex; gap: 12px;
  align-items: baseline; background: var(--bg); flex-shrink: 0;
}
.chat-header strong { color: var(--text); font-weight: 530; cursor: pointer }
.chat-header strong span { color: var(--accent) }

/* ── Messages ── */
.messages {
  flex: 1; overflow-y: auto; padding: 32px 32px;
  max-width: 780px; margin: 0 auto; width: 100%;
}
.msg { margin-bottom: 28px; animation: in .2s ease-out }
@keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }
.msg.user { text-align: right }
.msg.user p {
  display: inline-block; background: var(--surface); color: var(--text);
  padding: 9px 16px; border-radius: 8px; max-width: 75%; text-align: left;
  font-size: .88rem; line-height: 1.5; border: 1px solid var(--border);
}
.msg.assistant { font-size: .88rem; line-height: 1.68; color: var(--text) }
.msg.assistant p { margin-bottom: 10px }
.msg.assistant p:last-child { margin-bottom: 0 }
.msg.assistant table { border-collapse: collapse; margin: 12px 0; font-size: .84rem; width: 100% }
.msg.assistant th, .msg.assistant td { border: 1px solid var(--border); padding: 7px 14px; text-align: left }
.msg.assistant th { background: var(--surface); font-weight: 500; color: var(--text2) }
.msg.assistant code { background: var(--surface); padding: 2px 6px; border-radius: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: .8rem; color: var(--text) }
.msg.assistant pre { background: var(--bg2); padding: 14px 18px; border-radius: 8px;
  overflow-x: auto; font-size: .82rem; border: 1px solid var(--border) }
.msg.assistant pre code { background: none; padding: 0 }
.msg.assistant a { color: var(--link); text-decoration: none }
.msg.assistant a:hover { text-decoration: underline }

/* Agent events */
.evt { font-size: .78rem; padding: 4px 0; display: flex; align-items: center; gap: 7px }
.evt.think { color: var(--think); font-style: italic }
.evt.tool { color: var(--tool) }
.evt.tool .tag { background: rgba(210,168,92,.1); border: 1px solid rgba(210,168,92,.2);
  padding: 1px 7px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: .72rem }
.evt.err { color: var(--err) }

.streaming::after { content: '▎'; animation: blink .8s step-end infinite; color: var(--accent); margin-left: 1px }
@keyframes blink { 50% { opacity: 0 } }

/* ── Sources panel ── */
.sources-box {
  margin-top: 14px; padding: 12px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; font-size: .78rem;
}
.sources-box .sources-title {
  color: var(--text2); font-weight: 500; margin-bottom: 8px;
  font-size: .76rem; text-transform: uppercase; letter-spacing: .4px;
}
.sources-box .source-item {
  padding: 6px 0; border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; gap: 8px; cursor: pointer;
  transition: background .12s; border-radius: 3px; padding: 6px;
}
.sources-box .source-item:last-child { border-bottom: none }
.sources-box .source-item:hover { background: rgba(255,255,255,.02) }
.sources-box .source-item .s-jn {
  color: var(--accent); font-weight: 500; font-size: .7rem;
  text-transform: uppercase; letter-spacing: .3px; white-space: nowrap;
  min-width: 60px;
}
.sources-box .source-item .s-src {
  color: var(--link); font-family: 'JetBrains Mono', monospace; font-size: .74rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sources-box .source-item .s-pv {
  color: var(--text3); font-size: .72rem; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hl-meta { display: flex; flex-wrap: wrap; gap: 3px }
.hl-chip {
  font-size: .65rem; padding: 1px 7px; border-radius: 3px;
  white-space: nowrap; color: var(--text);
}
.hl-chip small { opacity: .6 }
.hl-pages { display: flex; gap: 2px; flex-shrink: 0 }
.pg-btn {
  background: var(--border); border: none; color: var(--text2);
  font-size: .62rem; padding: 1px 7px; border-radius: 3px;
  cursor: pointer; font-family: inherit; transition: all .12s;
}
.pg-btn:hover { background: var(--accent); color: var(--bg); }

/* Typing dots */
.dots { display: flex; gap: 3px; padding: 6px 0 }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); animation: b 1.2s infinite }
.dots span:nth-child(2) { animation-delay: .2s }
.dots span:nth-child(3) { animation-delay: .4s }
@keyframes b { 0%,60%,100% { transform: translateY(0) } 30% { transform: translateY(-4px); background: var(--accent) } }

/* ── Welcome ── */
.welcome {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 20px; padding: 40px; text-align: center;
}
.welcome .wl { font-size: 1.5rem; font-weight: 530; color: var(--text); letter-spacing: -.3px }
.welcome .wl em { color: var(--accent); font-style: normal }
.welcome .ws { font-size: .85rem; color: var(--text3); line-height: 1.6; max-width: 380px }
.welcome .we { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px }
.welcome .we button {
  background: none; border: 1px solid var(--border2); color: var(--text2);
  padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: .8rem;
  font-family: inherit; transition: all .15s;
}
.welcome .we button:hover { background: var(--surface); color: var(--text); border-color: var(--text3) }
.welcome .wi { width: 100%; max-width: 480px; display: flex; gap: 10px; margin-top: 12px }
.welcome .wi input {
  flex: 1; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px;
  padding: 12px 18px; font-size: .9rem; color: var(--text); font-family: inherit; outline: none;
  transition: border-color .2s;
}
.welcome .wi input:focus { border-color: var(--text3) }
.welcome .wi input::placeholder { color: var(--text3) }
.welcome .wi button {
  background: var(--surface); color: var(--text); border: 1px solid var(--border2);
  border-radius: 8px; padding: 12px 24px; font-size: .88rem; cursor: pointer;
  font-family: inherit; font-weight: 450; transition: all .15s;
}
.welcome .wi button:hover { border-color: var(--accent); color: var(--accent) }

/* ── Input area ── */
.input-area {
  padding: 16px 32px 22px; border-top: 1px solid var(--border);
  background: var(--bg); flex-shrink: 0;
}
.input-row { display: flex; gap: 10px; align-items: flex-end; max-width: 780px; margin: 0 auto }
.input-row textarea {
  flex: 1; background: var(--surface); border: 1px solid var(--border2);
  border-radius: 8px; padding: 12px 16px; font-family: inherit; font-size: .88rem;
  resize: none; outline: none; max-height: 130px; line-height: 1.5; color: var(--text);
  transition: border-color .2s;
}
.input-row textarea:focus { border-color: var(--text3) }
.input-row textarea::placeholder { color: var(--text3) }
.input-row button {
  padding: 10px 22px; border-radius: 8px; font-size: .85rem; font-weight: 450;
  cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap;
  border: 1px solid var(--border2);
}
.btn-send { background: var(--surface); color: var(--text) }
.btn-send:hover { border-color: var(--accent); color: var(--accent) }
.btn-send:disabled { opacity: .35; cursor: default; border-color: var(--border2); color: var(--text2) }
.btn-stop { background: rgba(248,81,73,.1); color: var(--err); border-color: rgba(248,81,73,.2) }
.btn-stop:hover { background: rgba(248,81,73,.18) }

/* ── PDF panel ── */
.pdf-panel {
  width: 50%; min-width: 400px; background: var(--bg);
  border-left: 1px solid var(--border); display: none; flex-direction: column;
}
.pdf-panel.on { display: flex }
.pdf-bar { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex;
  justify-content: space-between; align-items: center; font-size: .82rem; color: var(--text2); flex-shrink: 0;
  background: var(--bg2); }
.pdf-bar button { background: none; border: none; cursor: pointer; color: var(--text3);
  font-size: 1.1rem; padding: 2px 8px; border-radius: 4px }
.pdf-bar button:hover { color: var(--text); background: rgba(255,255,255,.04) }
.pdf-panel iframe, .pdf-pages { flex: 1; border: none; background: #1a1d22; overflow-y: auto }
.pdf-page-wrap { position: relative; margin: 0 auto }
.pdf-page-wrap canvas { display: block; margin: 0 auto }
.hl-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1 }
.hl-overlay .hl-rect { position: absolute; mix-blend-mode: multiply;
  border-radius: 2px; transition: opacity .15s }
.hl-overlay .hl-rect:hover { opacity: 0.6 !important }

/* ── Library modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
  z-index: 100; justify-content: center; align-items: center;
}
.modal-overlay.on { display: flex }
.modal {
  background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px;
  width: 92%; max-width: 900px; max-height: 84vh; display: flex; flex-direction: column;
  overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,.4);
}
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0 }
.modal-header strong { font-weight: 500; font-size: .95rem }
.modal-header button { background: none; border: none; cursor: pointer; color: var(--text3);
  font-size: 1.2rem; padding: 4px 8px; border-radius: 4px }
.modal-header button:hover { color: var(--text); background: rgba(255,255,255,.04) }
.modal-filters { padding: 10px 24px; display: flex; gap: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0 }
.modal-filters select {
  background: var(--surface); border: 1px solid var(--border2); border-radius: 6px;
  padding: 6px 10px; font-size: .8rem; color: var(--text2); font-family: inherit; cursor: pointer; outline: none
}
.modal-filters select:focus { border-color: var(--text3) }
.modal-filters span { font-size: .8rem; color: var(--text3); align-self: center }
.modal-list { flex: 1; overflow-y: auto; padding: 10px 24px }
.paper-row { padding: 12px 14px; border-bottom: 1px solid var(--border); transition: background .12s; border-radius: 4px }
.paper-row:hover { background: rgba(255,255,255,.01) }
.paper-row .jn { font-size: .7rem; color: var(--accent); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px }
.paper-row .src { font-size: .76rem; color: var(--text3); font-family: 'JetBrains Mono', monospace }
.paper-row .pv { font-size: .82rem; color: var(--text2); margin-top: 4px; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.paper-row .acts { margin-top: 8px; display: flex; gap: 8px }
.paper-row .acts button {
  padding: 4px 12px; border-radius: 5px; cursor: pointer; font-size: .76rem;
  font-family: inherit; background: none; border: 1px solid var(--border2); color: var(--text2); transition: all .15s
}
.paper-row .acts button:hover { background: var(--surface); color: var(--text); border-color: var(--text3) }
.paper-row .acts .btn-primary { border-color: rgba(210,168,92,.25); color: var(--accent) }
.paper-row .acts .btn-primary:hover { background: rgba(210,168,92,.08) }
.modal-pager { padding: 12px 24px; border-top: 1px solid var(--border);
  display: flex; justify-content: center; gap: 10px; align-items: center; flex-shrink: 0 }
.modal-pager button {
  padding: 5px 16px; border: 1px solid var(--border2); border-radius: 6px;
  background: transparent; cursor: pointer; font-size: .8rem; color: var(--text2); font-family: inherit; transition: all .15s
}
.modal-pager button:hover { background: var(--surface); color: var(--text) }
.modal-pager button:disabled { opacity: .3; cursor: default }
.modal-pager small { font-size: .8rem; color: var(--text3) }
</style>
</head>
<body>

<nav>
  <header>
    <div class="brand">Sunny<i>RAG</i></div>
    <button onclick="newChat()">+ 新对话</button>
    <button onclick="openLibrary()">论文库</button>
  </header>
  <div class="sessions" id="sessionList"></div>
  <footer>chunked_v3 · DeepSeek</footer>
</nav>

<main>
  <div class="chat-header">
    <strong onclick="newChat()">钙钛矿 AI 助手 <span>·</span></strong>
    <span id="chatStatus">就绪</span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="inputBox" rows="1" placeholder="输入你的问题…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px'"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">发送</button>
      <button class="btn-stop" id="stopBtn" onclick="stopGeneration()" style="display:none">停止</button>
    </div>
  </div>
</main>

<div class="pdf-panel" id="pdfPanel">
  <div class="pdf-bar">
    <span id="pdfPanelTitle"></span>
    <span style="display:flex;gap:4px;align-items:center">
      <button onclick="pdfZoom(-0.2)" title="缩小">−</button>
      <span id="pdfZoomLabel" style="font-size:.72rem;min-width:36px;text-align:center">160%</span>
      <button onclick="pdfZoom(+0.2)" title="放大">+</button>
      <button onclick="closePdfPanel()" style="margin-left:8px">×</button>
    </span>
  </div>
  <div class="pdf-pages" id="pdfPages"></div>
</div>

<div class="modal-overlay" id="libOverlay" onclick="if(event.target===this)closeLibrary()">
  <div class="modal">
    <div class="modal-header">
      <strong>论文库</strong>
      <button onclick="closeLibrary()">×</button>
    </div>
    <div class="modal-filters">
      <select id="jf" onchange="filterPapers()"><option value="">所有期刊</option></select>
      <select id="yf" onchange="filterPapers()"><option value="">所有年份</option></select>
      <span id="paperCount"></span>
    </div>
    <div class="modal-list" id="paperList"></div>
    <div class="modal-pager">
      <button id="prevPage" onclick="pagePapers(-1)">‹</button>
      <small id="pageInfo"></small>
      <button id="nextPage" onclick="pagePapers(1)">›</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pdfModalOverlay" onclick="if(event.target===this)closePdfModal()">
  <div class="modal" style="height:92%">
    <div class="modal-header">
      <span id="modalPdfTitle" style="font-size:.82rem;color:var(--text2)"></span>
      <button onclick="closePdfModal()">×</button>
    </div>
    <iframe id="modalPdfFrame" style="flex:1;border:none;background:#1a1d22;color-scheme:dark"></iframe>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
// fallback: 如果 CDN 加载失败（国内网络问题），marked 和 pdfjsLib 可能为 undefined
if(typeof marked === 'undefined'){ console.warn('[init] marked.js not loaded, using plain text'); }
if(typeof pdfjsLib === 'undefined'){ console.warn('[init] pdf.js not loaded, PDF viewer will fallback to iframe'); }

/* ═══════════════════════════════════════════════
   Application Logic
   ═══════════════════════════════════════════════ */

let sid = null, busy = false, hasMsg = false;
let papers = null, page = 1;
let ctrl = null, taskId = null;
window._fc = {};

function setGenerating(on){
  busy = on;
  document.getElementById('sendBtn').style.display = on ? 'none' : 'inline-block';
  document.getElementById('stopBtn').style.display = on ? 'inline-block' : 'none';
  document.getElementById('chatStatus').textContent = on ? '思考中…' : '就绪';
}
function finishGeneration(){
  setGenerating(false);
  renderSessions();
}

(async function init(){
  try {
    const s = localStorage.getItem('ss');
    if(s) {
      // 验证 session 在服务器上仍然存在
      const r = await fetch('/api/sessions/' + s + '/messages');
      if(r.ok) {
        sid = s; await load(s);
      } else {
        localStorage.removeItem('ss');
        sid = null;
      }
    }
  } catch(e) {
    console.error('[init] error:', e);
    localStorage.removeItem('ss');
    sid = null;
  }
  await renderSessions();
})();

async function load(id){
  const r = await fetch('/api/sessions/'+id+'/messages');
  const d = await r.json();
  console.log('[load] session:', id, 'msgs:', d.messages?.length);
  const el = document.getElementById('messages'); el.innerHTML = '';
  if(d.messages && d.messages.length) {
    hasMsg = true;
    let activeTask = null;
    for(const m of d.messages) {
      const msgEl = add(m.role, m.content);
      if(m.sources && m.sources.length) {
        renderSourcesBox(msgEl, m.sources);
        for(const s of m.sources){
          if(s.highlight && s.highlight.chunks) setPdfHighlights(s.file_id, s.highlight);
        }
      }
      if(m._task_id) activeTask = {el: msgEl, taskId: m._task_id, content: m.content};
    }
    scrollDown();
    if(activeTask) {
      // 有活跃任务：显示当前内容 + 流式光标，然后轮询等消息完成
      const raw = activeTask.content.replace(/\n\n_\(回答未完成\)_$/, '');
      console.log('[load] active task:', activeTask.taskId, 'rawLen:', raw.length);
      window._fc[activeTask.taskId] = raw;
      if(!raw) {
        activeTask.el.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
      }
      activeTask.el.classList.add('streaming');
      setGenerating(true);
      // 使用轮询方式等待任务完成，然后再拉取一次消息
      pollForCompletion(id, activeTask.taskId);
    } else {
      console.log('[load] no active task');
    }
  } else { hasMsg = false; welcome() }
}

async function pollForCompletion(sessionId, taskId){
  // 轮询等待活跃任务完成（最多等 120 秒）
  const guard = sid;
  for(let i = 0; i < 240; i++){
    await new Promise(r => setTimeout(r, 500));
    if(sid !== guard) { console.log('[poll] session changed, stopping'); return; }
    const r = await fetch('/api/sessions/'+sessionId+'/messages');
    const d = await r.json();
    const lastMsg = d.messages?.[d.messages.length - 1];
    // 任务完成（没有 _task_id 了）
    if(lastMsg && !lastMsg._task_id) {
      console.log('[poll] task completed, reloading messages');
      const el = document.getElementById('messages'); el.innerHTML = '';
      for(const m of d.messages) {
        const msgEl = add(m.role, m.content);
        if(m.sources && m.sources.length) renderSourcesBox(msgEl, m.sources);
      }
      scrollDown();
      finishGeneration();
      return;
    }
    // 任务还在跑，用最新内容更新 DOM
    if(lastMsg && lastMsg._task_id && lastMsg.content) {
      const raw = lastMsg.content.replace(/\n\n_\(回答未完成\)_$/, '');
      if(raw && raw !== window._fc[taskId]) {
        console.log('[poll] updating content, len:', raw.length);
        window._fc[taskId] = raw;
        const el = document.querySelector('.msg.assistant:last-child');
        if(el) { el.innerHTML = md(raw); el.classList.add('streaming'); scrollDown(); }
      }
    }
  }
  console.log('[poll] timeout');
  finishGeneration();
}

async function streamTask(taskId, offset){
  console.log('[streamTask] taskId:', taskId, 'offset:', offset);
  if(ctrl) ctrl.abort();
  const c = new AbortController(); ctrl = c; c._tid = taskId;
  const el = document.querySelector('.msg.assistant:last-child');
  if(!el) { console.log('[streamTask] no .msg.assistant element found'); return; }
  const guard = sid;
  console.log('[streamTask] guard:', guard);

  const resp = await fetch('/api/chat/'+taskId+'/stream?offset='+offset, {signal:c.signal});
  console.log('[streamTask] fetch resp:', resp.status, resp.ok);
  if(!resp.ok||!resp.body) { console.log('[streamTask] bad response'); finishGeneration(); return }
  const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
  let receivedText = false;
  (async function pump(){
    while(true){
      try { const{value,done}=await reader.read(); if(guard!==sid) { console.log('[streamTask pump] guard mismatch, exiting'); return; }
        if(done) {
          console.log('[streamTask pump] stream done, receivedText:', receivedText,
            'fcLen:', (window._fc[taskId]||'').length);
          el.classList.remove('streaming');
          // 如果流结束了但没收到任何文字，说明任务在 load() 和 streamTask() 之间刚好完成
          // 内容已存到 history，直接从服务端重新拉取消息
          if(!receivedText && !(window._fc[taskId]||'').trim()) {
            console.log('[streamTask pump] no text received, reloading messages');
            await load(guard);
            finishGeneration();
          } else {
            finishGeneration();
          }
          return;
        }
        buf += dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop()||'';
        for(const l of lines){ if(!l.startsWith('data: ')) continue;
          try { const d=JSON.parse(l.slice(6));
            if(d.type==='text'){
              receivedText = true;
              window._fc[taskId]=(window._fc[taskId]||'')+d.content;
              el.innerHTML = md(window._fc[taskId]); el.classList.add('streaming'); scrollDown();
            } else if(d.type==='sources'){
              window._sources = d.data;
              renderSourcesBox(el, window._sources);
              for(const s of d.data){
                if(s.highlight && s.highlight.chunks) setPdfHighlights(s.file_id, s.highlight);
              }
            } else if(d.type==='done'){
              console.log('[streamTask pump] received done event');
            }
          } catch(_){} }
      } catch(e) { console.log('[streamTask pump] error:', e.name, e.message); if(e.name!=='AbortError'){ console.error(e); finishGeneration(); } return }
    }
  })();
}

async function sendMessage(){
  const inp = document.getElementById('inputBox'); const text = inp.value.trim();
  if(!text || busy) return; inp.value = ''; inp.style.height = 'auto';

  if(!sid){ const r=await fetch('/api/sessions',{method:'POST'}); const d=await r.json();
    sid=d.id; localStorage.setItem('ss',sid); await renderSessions(); }

  add('user', text); hasMsg = true;
  const wel = document.querySelector('.welcome'); if(wel) wel.remove();

  setGenerating(true);

  const msgEl = add('assistant', '<div class="dots"><span></span><span></span><span></span></div>');
  const bubble = msgEl;

  let guard = sid;
  console.log('[sendMessage] guard:', guard, 'sid:', sid);
  try {
    const r0 = await fetch('/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,session_id:sid})});
    if(!r0.ok){ bubble.innerHTML = '<span class="evt err">请求失败 HTTP '+r0.status+'</span>'; return finishGeneration() }
    const{task_id}=await r0.json(); taskId=task_id; window._fc[task_id]='';
    console.log('[sendMessage] task_id:', task_id);

    const c = new AbortController(); ctrl = c; c._tid = taskId;
    const r1 = await fetch('/api/chat/'+task_id+'/stream?offset=0',{signal:c.signal});
    if(!r1.ok||!r1.body) { bubble.innerHTML = '<span class="evt err">连接失败</span>'; return finishGeneration() }

    const reader = r1.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while(true){
      const{value,done}=await reader.read(); if(guard!==sid) { console.log('[sendMessage stream] guard mismatch, exiting. guard:', guard, 'sid:', sid); return; } if(done) break;
      buf += dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop()||'';
      for(const l of lines){ if(!l.startsWith('data: ')) continue;
        try{ const d=JSON.parse(l.slice(6));
          if(d.type==='text'){
            window._fc[task_id]+=d.content;
            bubble.innerHTML = md(window._fc[task_id]); bubble.classList.add('streaming'); scrollDown();
          } else if(d.type==='sources'){
            window._sources = d.data;
            renderSourcesBox(bubble, window._sources);
            // 存储高亮元数据供 pdf.js 使用
            for(const s of d.data){
              if(s.highlight && s.highlight.chunks){
                setPdfHighlights(s.file_id, s.highlight);
              }
            }
          }
        }catch(_){} }
    }
    bubble.classList.remove('streaming');
    console.log('[sendMessage] stream completed normally');
  } catch(e) { console.log('[sendMessage] catch:', e.name, e.message); if(e.name!=='AbortError') { bubble.innerHTML = '<span class="evt err">错误: '+esc(e.message)+'</span>' } }
  console.log('[sendMessage] cleanup: sid:', sid, 'guard:', guard, 'match:', sid===guard);
  if(sid === guard) finishGeneration();
}

function stopGeneration(){
  const t = (ctrl&&ctrl._tid)||taskId;
  if(ctrl) ctrl.abort();
  if(t) fetch('/api/chat/'+t+'/cancel',{method:'POST'}).catch(()=>{});
  taskId=null;
  finishGeneration();
}

/* ═══════════════════════════════════════════════
   PDF Viewer (pdf.js + CSS highlight overlay)
   ═══════════════════════════════════════════════ */
function pdfUrl(fid){ return '/api/pdf/'+fid }
function fid(src){ return String(src).replace(/\.pdf$/,'') }

let _pdfDoc = null, _pdfFid = null, _pdfScale = 1.6;
const _pdfHighlights = {}; // fid → [{pages: [], chunks: [...]}]

// 存储 highlight 元数据（从 sources 事件收集）
function setPdfHighlights(fid, data){ _pdfHighlights[fid] = data }

async function openPdf(src){
  const f = fid(src);
  document.getElementById('pdfPanelTitle').textContent = f;
  document.getElementById('pdfPanel').classList.add('on');
  // pdf.js 未加载时退回 iframe
  if(typeof pdfjsLib === 'undefined'){
    const pagesDiv = document.getElementById('pdfPages');
    pagesDiv.innerHTML = '<iframe src="'+pdfUrl(f)+'" style="width:100%;height:100%;border:none;background:#1a1d22;color-scheme:dark"></iframe>';
    return;
  }
  if(_pdfFid === f) return; // 同一个文件不重新加载
  _pdfFid = f; _pdfDoc = null; _pdfScale = 1.6;
  document.getElementById('pdfZoomLabel').textContent = '160%';
  const pagesDiv = document.getElementById('pdfPages');
  pagesDiv.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">加载中…</div>';

  try {
    const loadingTask = pdfjsLib.getDocument(pdfUrl(f));
    _pdfDoc = await loadingTask.promise;
    pagesDiv.innerHTML = '';

    const dpr = window.devicePixelRatio || 1;

    async function _renderAllPages(){
      const pagesDiv = document.getElementById('pdfPages');
      pagesDiv.innerHTML = '';
      const scale = _pdfScale;
      for(let i=1; i<=_pdfDoc.numPages; i++){
        const page = await _pdfDoc.getPage(i);
        const vp = page.getViewport({scale: scale * dpr});
        const logicalVp = page.getViewport({scale: scale});
        const wrap = document.createElement('div');
        wrap.className = 'pdf-page-wrap';
        wrap.style.width = logicalVp.width + 'px';
        wrap.style.height = logicalVp.height + 'px';

        const canvas = document.createElement('canvas');
        canvas.width = vp.width;
        canvas.height = vp.height;
        canvas.style.width = logicalVp.width + 'px';
        canvas.style.height = logicalVp.height + 'px';
        const ctx = canvas.getContext('2d');
        await page.render({canvasContext: ctx, viewport: vp}).promise;
        wrap.appendChild(canvas);

        const overlay = document.createElement('div');
        overlay.className = 'hl-overlay';
        overlay.setAttribute('data-page', i);
        wrap.appendChild(overlay);
        pagesDiv.appendChild(wrap);
      }
      await renderHighlights();
    }

    await _renderAllPages();
  } catch(e){
    console.error('[pdf] load error:', e);
    pagesDiv.innerHTML = '<div style="padding:40px;text-align:center;color:var(--err)">加载失败: '+esc(e.message)+'</div>';
  }
}

async function renderHighlights(){
  if(!_pdfDoc || !_pdfFid) return;
  const hlData = _pdfHighlights[_pdfFid];
  if(!hlData || !hlData.chunks || !hlData.chunks.length) return;

  // 清除旧高亮
  document.querySelectorAll('#pdfPages .hl-rect').forEach(e=>e.remove());

  const numPages = _pdfDoc.numPages;
  for(let ci=0; ci<hlData.chunks.length; ci++){
    const chunk = hlData.chunks[ci];
    const colorIdx = ci % HL_COLORS.length;

    // 只在 chunk 指定的页码上搜索
    const targetPages = (chunk.pages && chunk.pages.length) ? chunk.pages : Array.from({length: numPages}, (_,i)=>i+1);

    for(const pn of targetPages){
      if(pn < 1 || pn > numPages) continue;
      const page = await _pdfDoc.getPage(pn);
      const textContent = await page.getTextContent();
      const vp = page.getViewport({scale: _pdfScale});  // 和渲染 scale 一致

      // 搜索 chunk 文本中的关键句子（优先用完整文本）
      const queries = _generatePdfQueries(chunk.text || chunk.text_preview || '');
      for(const q of queries){
        const matches = _findInTextContent(textContent, q);
        for(const m of matches){
          // 计算 viewport 坐标
          const x0 = Math.min(...m.map(t => vp.convertToViewportPoint(t.transform[4], t.transform[5])[0]));
          const y0 = Math.min(...m.map(t => vp.convertToViewportPoint(t.transform[4], t.transform[5])[1]));
          const x1 = Math.max(...m.map(t => vp.convertToViewportPoint(t.transform[4] + t.width, t.transform[5] + t.height)[0]));
          const y1 = Math.max(...m.map(t => vp.convertToViewportPoint(t.transform[4] + t.width, t.transform[5] + t.height)[1]));

          // 扩展到栏宽
          const overlay = document.querySelector('#pdfPages .hl-overlay[data-page="'+pn+'"]');
          if(!overlay) continue;
          const wrap = overlay.parentElement;
          const wrapW = parseFloat(wrap.style.width);
          const wrapH = parseFloat(wrap.style.height);

          const leftPct = (x0 / wrapW * 100).toFixed(1);
          const topPct = (y0 / wrapH * 100).toFixed(1);
          const wPct = ((x1 - x0) / wrapW * 100).toFixed(1);
          const hPct = ((y1 - y0) / wrapH * 100).toFixed(1);

          const rect = document.createElement('div');
          rect.className = 'hl-rect';
          rect.style.cssText = [
            'left:'+leftPct+'%', 'top:'+topPct+'%',
            'width:'+wPct+'%', 'height:'+hPct+'%',
            'background:'+HL_COLORS[colorIdx],
            'opacity:0.45'
          ].join(';');
          overlay.appendChild(rect);
        }
      }
    }
  }
}

function _generatePdfQueries(text){
  // 生成适合在 pdf.js textContent 中搜索的短片段
  text = (text||'').replace(/[#*_]/g, '').replace(/\s+/g, ' ').trim();
  const queries = [];
  if(text.length >= 20) queries.push(text.slice(0, 200));
  for(const s of text.split(/[.!?]/)){
    const t = s.trim();
    if(t.length >= 25 && t.length <= 150) queries.push(t);
  }
  return queries;
}

function _findInTextContent(textContent, query){
  // 在 pdf.js textContent items 中搜索 query，返回匹配的 item 数组
  const items = textContent.items.filter(it => it.str && it.str.trim().length > 1);
  const normQuery = query.toLowerCase().replace(/\s+/g, ' ').trim();
  if(normQuery.length < 15) return [];

  // 构建全文和索引映射
  const fullText = items.map(it => it.str).join(' ');
  const lowerText = fullText.toLowerCase();

  // 在全文和归一化文本中都搜索，取更长的匹配
  const matches = [];
  let idx = lowerText.indexOf(normQuery);
  if(idx < 0){
    // 尝试更短的片段
    const words = normQuery.split(' ');
    if(words.length > 5){
      const short = words.slice(0, Math.ceil(words.length/2)).join(' ');
      idx = lowerText.indexOf(short);
    }
  }
  if(idx < 0) return [];

  // 找到匹配位置对应的 items
  let charPos = 0, startItem = -1, endItem = -1;
  for(let i=0; i<items.length; i++){
    const len = items[i].str.length + 1; // +1 for space
    if(startItem < 0 && charPos + items[i].str.length > idx) startItem = i;
    if(endItem < 0 && charPos > idx + normQuery.length) { endItem = i-1; break; }
    charPos += len;
  }
  if(startItem < 0) return [];
  if(endItem < 0) endItem = Math.min(startItem + 15, items.length - 1);

  return items.slice(startItem, endItem + 1);
}

function openPdfPage(fid, page){
  openPdf(fid);
  // 滚动到指定页
  setTimeout(()=>{
    const pages = document.querySelectorAll('#pdfPages .pdf-page-wrap');
    if(pages[page-1]) pages[page-1].scrollIntoView({behavior:'smooth', block:'start'});
  }, 500);
}

async function pdfZoom(delta){
  _pdfScale = Math.max(0.5, Math.min(3.0, _pdfScale + delta));
  document.getElementById('pdfZoomLabel').textContent = Math.round(_pdfScale * 100) + '%';
  if(!_pdfDoc) return;
  const dpr = window.devicePixelRatio || 1;
  const pagesDiv = document.getElementById('pdfPages');
  const canvases = pagesDiv.querySelectorAll('canvas');
  const scale = _pdfScale;
  for(let i=0; i<canvases.length; i++){
    const pageNum = i + 1;
    const page = await _pdfDoc.getPage(pageNum);
    const vp = page.getViewport({scale: scale * dpr});
    const logicalVp = page.getViewport({scale: scale});
    const wrap = canvases[i].parentElement;
    wrap.style.width = logicalVp.width + 'px';
    wrap.style.height = logicalVp.height + 'px';
    canvases[i].width = vp.width;
    canvases[i].height = vp.height;
    canvases[i].style.width = logicalVp.width + 'px';
    canvases[i].style.height = logicalVp.height + 'px';
    const ctx = canvases[i].getContext('2d');
    await page.render({canvasContext: ctx, viewport: vp}).promise;
  }
  // 重新渲染高亮
  document.querySelectorAll('#pdfPages .hl-rect').forEach(e=>e.remove());
  await renderHighlights();
}

function closePdfPanel(){
  document.getElementById('pdfPanel').classList.remove('on');
  document.getElementById('pdfPages').innerHTML = '';
  _pdfDoc = null; _pdfFid = null;
}
function openPdfModal(src){ const f=fid(src);
  document.getElementById('modalPdfTitle').textContent=f;
  document.getElementById('pdfModalOverlay').classList.add('on');
  document.getElementById('modalPdfFrame').src=pdfUrl(f); }
function closePdfModal(){ document.getElementById('pdfModalOverlay').classList.remove('on');
  document.getElementById('modalPdfFrame').src=''; }

/* Library */
async function openLibrary(){
  document.getElementById('libOverlay').classList.add('on');
  if(!papers) await loadPapers();
  updateFilters(); renderPapers();
}
function closeLibrary(){ document.getElementById('libOverlay').classList.remove('on') }
async function loadPapers(){ const r=await fetch('/api/papers?page_size=100'); papers=await r.json() }
function updateFilters(){
  const cs = papers.categories||[];
  document.getElementById('jf').innerHTML='<option value="">所有期刊</option>'+cs.map(c=>'<option value="'+c+'">'+c+'</option>').join('');
  const ys=[...new Set((papers.papers||[]).map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a);
  document.getElementById('yf').innerHTML='<option value="">所有年份</option>'+ys.map(y=>'<option value="'+y+'">'+y+'</option>').join('');
}
function filterPapers(){ page=1;renderPapers() }
function pagePapers(d){ page=Math.max(1,page+d);renderPapers() }
async function renderPapers(){
  const jf=document.getElementById('jf'),yf=document.getElementById('yf');
  let url='/api/papers?page='+page+'&page_size=20';
  if(jf.value)url+='&category='+encodeURIComponent(jf.value);
  if(yf.value)url+='&year='+encodeURIComponent(yf.value);
  const r=await fetch(url);const d=await r.json();
  const list=document.getElementById('paperList');list.innerHTML='';
  document.getElementById('paperCount').textContent=d.total+' 篇';
  document.getElementById('pageInfo').textContent=d.page+' / '+d.total_pages;
  document.getElementById('prevPage').disabled=d.page<=1;
  document.getElementById('nextPage').disabled=d.page>=d.total_pages;
  for(const p of d.papers){
    const div=document.createElement('div');div.className='paper-row';
    div.innerHTML='<div class="jn">'+esc(p.journal)+'</div>'+
      '<div class="src">'+esc(p.source)+'</div>'+
      '<div class="pv">'+esc((p.title_preview||'').slice(0,200))+'</div>'+
      '<div class="acts">'+
      '<button class="btn-primary" onclick="closeLibrary();interpret(\''+p.id+'\')">解读</button>'+
      '<button onclick="openPdfModal(\''+p.source+'\')">PDF</button></div>';
    list.appendChild(div);
  }
}
async function interpret(id){
  if(!sid){ const r=await fetch('/api/sessions',{method:'POST'});const d=await r.json();
    sid=d.id;localStorage.setItem('ss',sid); }
  document.getElementById('inputBox').value='解读这篇论文';sendMessage();
}

document.addEventListener('click',function(e){
  const a=e.target.closest('a[href^="/api/pdf/"]');if(!a)return;
  e.preventDefault();
  const raw=new URL(a.href,location.origin).pathname.replace('/api/pdf/','');
  if(e.ctrlKey||e.metaKey) openPdfModal(raw); else openPdf(raw);
});
</script>
