<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PerovskiteGPT - 钙钛矿专家</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.css"/>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; }
body { display: flex; overflow: hidden; }
.sidebar { width: 280px; min-width: 280px; background: #1e2a3a; color: #ccc; display: flex; flex-direction: column; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #2a3a4a; }
.sidebar-header h2 { font-size: 1rem; color: #fff; margin-bottom: 8px; }
.sidebar-header .nav-btn { width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: .85rem; margin-bottom: 4px; }
.btn-new-chat { background: #4CAF50; color: #fff; }
.btn-new-chat:hover { background: #45a049; }
.btn-library { background: #007aff; color: #fff; }
.btn-library:hover { background: #005fc1; }
.session-list { flex: 1; overflow-y: auto; padding: 8px; }
.session-item { padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; font-size: .85rem; position: relative; }
.session-item:hover { background: #2a3a4a; }
.session-item.active { background: #007aff; color: #fff; }
.session-title-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.session-title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.session-actions { display: none; gap: 2px; flex-shrink: 0; }
.session-item:hover .session-actions { display: flex; }
.btn-session-edit, .btn-session-del { background: none; border: none; cursor: pointer; padding: 2px 4px; font-size: .75rem; border-radius: 4px; line-height: 1; }
.btn-session-edit:hover, .btn-session-del:hover { background: rgba(255,255,255,.15); }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid #2a3a4a; font-size: .75rem; color: #666; text-align: center; }
.main { flex: 1; display: flex; flex-direction: row; min-width: 0; }
.chat-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.chat-header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.chat-header h1 { font-size: 1.1rem; color: #2c3e50; cursor: pointer; }
.chat-header h1 span { color: #007aff; }
.chat-header .subtitle { font-size: .8rem; color: #999; }
.messages { flex: 1; overflow-y: auto; padding: 20px 24px; }
.msg { margin-bottom: 16px; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg-user { text-align: right; }
.msg-user .bubble { display: inline-block; background: #007aff; color: #fff; padding: 10px 16px; border-radius: 18px 18px 4px 18px; max-width: 75%; text-align: left; font-size: .95rem; }
.msg-assistant .bubble { display: inline-block; background: #fff; border: 1px solid #e0e0e0; padding: 14px 18px; border-radius: 18px 18px 18px 4px; max-width: 100%; font-size: .95rem; line-height: 1.6; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.msg-assistant .bubble p { margin-bottom: 8px; }
.msg-assistant .bubble p:last-child { margin-bottom: 0; }
.msg-assistant .bubble table { border-collapse: collapse; margin: 8px 0; font-size: .9rem; width: 100%; }
.msg-assistant .bubble th, .msg-assistant .bubble td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
.msg-assistant .bubble th { background: #f5f7fa; }
.msg-assistant .bubble code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: .85rem; }
.msg-assistant .bubble pre { background: #f5f5f5; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: .85rem; }
.bubble a { color: #007aff; text-decoration: none; }
.bubble a:hover { text-decoration: underline; }
.typing .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #999; margin: 0 2px; animation: bounce 1.2s infinite; }
.typing .dot:nth-child(2) { animation-delay: .2s; }
.typing .dot:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
.msg-assistant .bubble.streaming::after { content: '\u258A'; animation: blink 0.8s step-end infinite; color: #007aff; }
@keyframes blink { 50% { opacity: 0; } }
.loading { display: flex; align-items: center; gap: 8px; color: #007aff; font-style: italic; }
.spinner { width: 16px; height: 16px; border: 2px solid #e0e0e0; border-top-color: #007aff; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.input-area { padding: 12px 24px 20px; border-top: 1px solid #e0e0e0; background: #fff; }
.input-row { display: flex; gap: 12px; align-items: flex-end; max-width: 800px; margin: 0 auto; }
.input-row textarea { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-family: inherit; font-size: .95rem; resize: none; outline: none; max-height: 120px; line-height: 1.4; }
.input-row textarea:focus { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0,122,255,.1); }
.input-row button { background: #007aff; color: #fff; border: none; border-radius: 24px; padding: 12px 28px; font-size: .95rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s; }
.input-row button:hover { background: #005fc1; }
.input-row button:disabled { background: #999; cursor: not-allowed; }
.input-row .stop-btn { background: #e74c3c; }
.input-row .stop-btn:hover { background: #c0392b; }
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: #555; text-align: center; gap: 20px; padding: 40px; }
.welcome .logo { font-size: 2.8rem; font-weight: 700; color: #2c3e50; letter-spacing: 2px; }
.welcome .logo span { color: #007aff; }
.welcome p { font-size: .95rem; color: #888; max-width: 400px; line-height: 1.6; }
.welcome .examples { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.welcome .examples button { background: #e9ecef; color: #555; border: 1px solid #dee2e6; border-radius: 20px; padding: 8px 18px; font-size: .85rem; cursor: pointer; transition: all .15s; }
.welcome .examples button:hover { background: #d0d4d9; border-color: #adb5bd; }
.welcome .welcome-input-row { width: 100%; max-width: 600px; display: flex; gap: 12px; align-items: center; margin-top: 8px; }
.welcome .welcome-input-row textarea { flex: 1; padding: 12px 20px; border: 1px solid #ced4da; border-radius: 28px; font-family: inherit; font-size: 1rem; resize: none; outline: none; max-height: 120px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.welcome .welcome-input-row textarea:focus { border-color: #007aff; box-shadow: 0 2px 12px rgba(0,122,255,.15); }
.welcome .welcome-input-row button { background: #007aff; color: #fff; border: none; border-radius: 40px; padding: 12px 32px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; white-space: nowrap; }
.welcome .welcome-input-row button:hover { background: #005fc1; }
.pdf-panel { width: 50%; min-width: 500px; background: #fff; border-left: 1px solid #e0e0e0; display: none; flex-direction: column; overflow: hidden; }
.pdf-panel.active { display: flex; }
.pdf-panel-header { padding: 12px 16px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; font-weight: 600; }
.pdf-panel-header button { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #999; }
.pdf-panel-header button:hover { color: #333; }
.pdf-panel { position: relative; }
.library-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; justify-content: center; align-items: center; }
.library-overlay.active { display: flex; }
.library-modal { background: #fff; border-radius: 16px; width: 90%; max-width: 1000px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.15); }
.library-header { padding: 20px 24px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.library-header h2 { font-size: 1.3rem; }
.library-header button { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #999; padding: 4px 8px; border-radius: 8px; }
.library-header button:hover { background: #f0f0f0; color: #333; }
.library-filters { padding: 12px 24px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #eee; flex-shrink: 0; }
.library-filters select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: .85rem; }
.library-list { flex: 1; overflow-y: auto; padding: 12px 24px; }
.paper-item { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background .1s; }
.paper-item:hover { background: #f8f9fa; }
.paper-item .journal { font-size: .75rem; color: #007aff; font-weight: 600; margin-bottom: 4px; }
.paper-item .source { font-size: .8rem; color: #999; }
.paper-item .preview { font-size: .85rem; color: #555; margin-top: 4px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.paper-item .actions { margin-top: 6px; display: flex; gap: 8px; }
.paper-item button { padding: 4px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: .8rem; }
.btn-interpret { background: #007aff; color: #fff; }
.btn-interpret:hover { background: #005fc1; }


.btn-open-pdf { background: #e9ecef; color: #555; }
.btn-open-pdf:hover { background: #d0d4d9; }
.library-pagination { padding: 12px 24px; display: flex; justify-content: center; gap: 8px; align-items: center; border-top: 1px solid #eee; flex-shrink: 0; }
.library-pagination button { padding: 6px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: .85rem; }
.library-pagination button:hover { background: #f0f0f0; }
.library-pagination button:disabled { opacity: .4; cursor: default; }
.pdf-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; justify-content: center; align-items: center; }
.pdf-modal-overlay.active { display: flex; }
.pdf-modal { background: #fff; width: 90%; height: 90%; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.pdf-modal-header { padding: 12px 20px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
.pdf-modal-header button { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #999; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>💬 会话</h2>
    <button class="nav-btn btn-new-chat" onclick="newChat()">✏️ 新对话</button>
    <button class="nav-btn btn-library" onclick="openLibrary()">📚 论文库</button>
  </div>
  <div class="session-list" id="sessionList"></div>
  <div class="sidebar-footer">PerovskiteGPT V4 · Sunny-RAG</div>
</div>

<div class="main">
  <div class="chat-area">
    <div class="chat-header">
      <h1 onclick="newChat()">Perovskite<span>GPT</span></h1>
      <span class="subtitle">钙钛矿 AI 研究助手</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="inputBox" rows="1" placeholder="问任何钙钛矿相关的问题..." onkeydown="onInputKey(event)" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
        <button id="sendBtn" onclick="sendMessage()">发送</button>
        <button id="stopBtn" class="stop-btn" onclick="stopGeneration()" style="display:none">停止</button>
      </div>
    </div>
  </div>
  <div class="pdf-panel" id="pdfPanel">
    <div class="pdf-panel-header">
      <span id="pdfPanelTitle">PDF 查看</span>
      <button onclick="closePdfPanel()">✕</button>
    </div>
    <iframe id="pdfPanelFrame" style="width:100%;height:100%;border:none;"></iframe>
  </div>
</div>

<div class="library-overlay" id="libraryOverlay">
  <div class="library-modal">
    <div class="library-header">
      <h2>📚 论文库</h2>
      <button onclick="closeLibrary()">✕</button>
    </div>
    <div class="library-filters">
      <select id="journalFilter" onchange="filterPapers()">
        <option value="">所有期刊</option>
      </select>
      <select id="yearFilter" onchange="filterPapers()">
        <option value="">所有年份</option>
      </select>
      <span id="paperCount" style="font-size:.85rem;color:#999;margin-left:auto"></span>
    </div>
    <div class="library-list" id="paperList"></div>
    <div class="library-pagination">
      <button id="prevPage" onclick="pagePapers(-1)">← 上一页</button>
      <span id="pageInfo"></span>
      <button id="nextPage" onclick="pagePapers(1)">下一页 →</button>
    </div>
  </div>
</div>

<div class="pdf-modal-overlay" id="pdfModalOverlay">
  <div class="pdf-modal">
    <div class="pdf-modal-header">
      <span id="modalPdfTitle">PDF</span>
      <button onclick="closePdfModal()">✕</button>
    </div>
    <iframe id="modalPdfFrame" style="width:100%;height:100%;border:none;"></iframe>
  </div>
</div>

<script>
// ── 状态 ──
let currentSessionId = null;
let streaming = false;
let hasMessages = false;
let currentPdfSource = null;
let currentModalPdfSource = null;
let papersCache = null;
let currentFilter = null;
let currentPage = 1;
let abortController = null;
let activeStreamAbort = null;
let currentTaskId = null;  // 当前正在生成的 task id
// 存储每个 task 的全量内容，用于 marked 渲染
window._fullContents = {};

// ── 初始化 ──
async function init() {
  const savedId = localStorage.getItem('currentSession');
  if (savedId) {
    currentSessionId = savedId;
    await loadSessionMessages(savedId);
  }
  await loadSessions();
}
init();

async function loadSessionMessages(sid) {
  try {
    const r = await fetch('/api/sessions/' + sid + '/messages');
    const data = await r.json();
    const msgDiv = document.getElementById('messages');
    msgDiv.innerHTML = '';
    if (data.messages && data.messages.length > 0) {
      hasMessages = true;
      for (const m of data.messages) {
        const el = addMessage(m.role, m.content);
        if (m.role === 'assistant' && m.content.includes('_(回答未完成)_')) {
          const bubble = el.querySelector('.bubble');
          if (bubble) bubble.classList.add('streaming');
        }
      }
      scrollToBottom();
      await resumeTaskIfNeeded(sid);
    } else {
      hasMessages = false;
      showWelcomeScreen();
    }
  } catch(e) {
    console.error('loadSessionMessages:', e);
  }
}

async function resumeTaskIfNeeded(sid) {
  try {
    const r = await fetch('/api/chat/tasks/active');
    const d = await r.json();
    const tasks = (d.tasks || {})[sid];
    if (!tasks || tasks.length === 0) return;
    const activeTask = tasks.find(t => !t.done);
    if (!activeTask) return;
    // 已有 streaming bubble？直接续
    const lastBubble = document.querySelector('.msg-assistant:last-child .bubble.streaming');
    if (!lastBubble) return;
    // 从已有内容长度开始
    const rawText = lastBubble.textContent;
    const offset = rawText.length;
    // 记录到 _fullContents（用于 marked 渲染）
    window._fullContents[activeTask.task_id] = rawText;
    // 启动 stream 消费
    fetchAndStream(activeTask.task_id, offset);
  } catch(e) {
    console.error('resumeTaskIfNeeded:', e);
  }
}

function showWelcomeScreen() {
  const msgDiv = document.getElementById('messages');
  msgDiv.innerHTML = '<div class="welcome" id="welcome">\
    <div class="logo">Perovskite<span>GPT</span></div>\
    <p>钙钛矿太阳能电池领域 AI 研究助手<br>问任何钙钛矿相关的问题</p>\
    <div class="examples">\
      <button onclick="askQuick(\'SAM分子层为什么可以作为空穴传输层？\')">SAM 作为 HTL</button>\
      <button onclick="askQuick(\'提升钙钛矿稳定性的主要方案\')">稳定性方案</button>\
      <button onclick="askQuick(\'MeO-2PACz和Me-4PACz哪个更好？\')">SAM 对比</button>\
      <button onclick="askQuick(\'FAPbI₃的带隙是多少\')">FAPbI₃ 带隙</button>\
    </div>\
    <div class="welcome-input-row">\
      <textarea id="welcomeInput" rows="1" placeholder="问任何钙钛矿相关的问题..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();askQuickFromWelcome()}"></textarea>\
      <button onclick="askQuickFromWelcome()">发送</button>\
    </div>\
  </div>';
}

// ── 会话管理 ──
async function loadSessions() {
  const r = await fetch('/api/sessions');
  const data = await r.json();
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  if (!currentSessionId) {
    showWelcomeScreen();
    hasMessages = false;
  }
  for (const s of data.sessions) {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
    div.innerHTML = '<div class="session-title-row">\
      <span class="session-title" onclick="switchSession(\'' + s.id + '\')">' + escapeHtml(s.title) + '</span>\
      <span class="session-actions">\
        <button class="btn-session-edit" onclick="event.stopPropagation();renameSession(\'' + s.id + '\')" title="重命名">✏️</button>\
        <button class="btn-session-del" onclick="event.stopPropagation();deleteSession(\'' + s.id + '\')" title="删除">🗑️</button>\
      </span>\
    </div>';
    list.appendChild(div);
  }
}

async function newChat() {
  if (activeStreamAbort) { activeStreamAbort.abort(); activeStreamAbort = null; }
  hasMessages = false;
  currentSessionId = null;
  localStorage.removeItem('currentSession');
  showWelcomeScreen();
  showChat();
  closePdfPanel();
  document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
}

function askQuickFromWelcome() {
  const inp = document.getElementById('welcomeInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  document.getElementById('inputBox').value = text;
  sendMessage();
}

async function switchSession(id) {
  if (id === currentSessionId) return;
  if (activeStreamAbort) { activeStreamAbort.abort(); activeStreamAbort = null; }
  currentSessionId = id;
  localStorage.setItem('currentSession', id);
  showChat();
  closePdfPanel();
  await loadSessionMessages(id);
  await loadSessions();
}

// ── 核心：从 stream endpoint 消费内容，更新 bubble ──
function fetchAndStream(taskId, offset) {
  if (activeStreamAbort) activeStreamAbort.abort();
  const ctrl = new AbortController();
  activeStreamAbort = ctrl;

  const bubble = document.querySelector('.msg-assistant:last-child .bubble');
  if (!bubble) return;
  const _sessionGuard = currentSessionId;

  fetch('/api/chat/' + taskId + '/stream?offset=' + offset, { signal: ctrl.signal })
    .then(resp => {
      if (!resp.ok || !resp.body) return;
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      function read() {
        reader.read().then(({ done, value }) => {
          if (_sessionGuard !== currentSessionId) return;
          if (done) { bubble.classList.remove('streaming'); return; }
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const d = JSON.parse(line.slice(6));
              if (d.type === 'text') {
                window._fullContents[taskId] = (window._fullContents[taskId] || '') + d.content;
                bubble.innerHTML = marked.parse(window._fullContents[taskId].replace(/\[📄\]\(([^\s)]+)\)/g, '<a href="$1" target="_blank" class="pdf-link">📄</a>'));
                bubble.classList.add('streaming');
                scrollToBottom();
              }
            } catch(e) {}
          }
          read();
        }).catch(e => { if (e.name !== 'AbortError') console.error(e); });
      }
      read();
    }).catch(e => { if (e.name !== 'AbortError') console.error(e); });
}

// ── 会话编辑/删除 ──
async function renameSession(id) {
  const el = document.querySelector('.session-item.active .session-title');
  const oldTitle = el ? el.textContent : '';
  const title = prompt('重命名会话', oldTitle);
  if (!title || title.trim() === '') return;
  await fetch('/api/sessions/' + id, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: title.trim() })
  });
  await loadSessions();
}

async function deleteSession(id) {
  if (!confirm('删除这个会话？')) return;
  await fetch('/api/sessions/' + id, { method: 'DELETE' });
  if (currentSessionId === id) {
    currentSessionId = null;
    const r = await fetch('/api/sessions');
    const d = await r.json();
    if (d.sessions.length > 0) await switchSession(d.sessions[0].id);
    else await newChat();
  } else {
    await loadSessions();
  }
}

// ── 发送消息 ──
function onInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  const input = document.getElementById('inputBox');
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = '';
  input.style.height = 'auto';

  if (!currentSessionId) {
    const r = await fetch('/api/sessions', { method: 'POST' });
    const d = await r.json();
    currentSessionId = d.id;
    localStorage.setItem('currentSession', currentSessionId);
    await loadSessions();
  }

  addMessage('user', text);
  hasMessages = true;
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  streaming = true;
  const sendBtn = document.getElementById('sendBtn');
  const stopBtn = document.getElementById('stopBtn');
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';

  const msgEl = addMessage('assistant', '<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>');
  const bubble = msgEl.querySelector('.bubble');

  try {
    // 1. 启动任务 → 拿到 task_id
    const startR = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: currentSessionId }),
    });
    if (!startR.ok) {
      bubble.innerHTML = '<p style="color:red">❌ 启动失败 HTTP ' + startR.status + '</p>';
      streaming = false; sendBtn.style.display = 'inline-block'; stopBtn.style.display = 'none';
      return;
    }
    const { task_id } = await startR.json();
    const tid = task_id;
    currentTaskId = tid;
    abortController = null;  // 重置，等 stream 连接后再赋值
    activeStreamAbort = null;
    window._fullContents[tid] = '';

    // 2. 消费 stream
    const ctrl = new AbortController();
    abortController = ctrl;
    activeStreamAbort = ctrl;
    ctrl._taskId = tid;  // 把 task id 挂到 AbortController 上

    const streamR = await fetch('/api/chat/' + tid + '/stream?offset=0', { signal: ctrl.signal });
    if (!streamR.ok || !streamR.body) {
      bubble.innerHTML = '<p style="color:red">❌ 连接 stream 失败</p>';
      streaming = false; sendBtn.style.display = 'inline-block'; stopBtn.style.display = 'none';
      return;
    }

    const _streamSid = currentSessionId;
    const reader = streamR.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (_streamSid !== currentSessionId) return;
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const d = JSON.parse(line.slice(6));
          if (d.type === 'text') {
            window._fullContents[tid] += d.content;
            bubble.innerHTML = marked.parse(window._fullContents[tid].replace(/\[📄\]\(([^\s)]+)\)/g, '<a href="$1" target="_blank" class="pdf-link">📄</a>'));
            bubble.classList.add('streaming');
            scrollToBottom();
          }
        } catch(e) {}
      }
    }
    bubble.classList.remove('streaming');

  } catch(e) {
    if (e.name === 'AbortError') {
      bubble.innerHTML += '<p style="color:#999;font-size:.8rem;margin-top:8px">⏹ 已停止</p>';
    } else {
      bubble.innerHTML = '<p style="color:red">❌ 错误: ' + escapeHtml(e.message) + '</p>';
    }
    console.error(e);
  }

  streaming = false;
  sendBtn.style.display = 'inline-block';
  stopBtn.style.display = 'none';
  await loadSessions();
}

function stopGeneration() {
  // 从 abortController 或 activeStreamAbort 上取 task_id
  const cid = (abortController && abortController._taskId) || (activeStreamAbort && activeStreamAbort._taskId) || currentTaskId;
  if (abortController) abortController.abort();
  if (cid) {
    fetch('/api/chat/' + cid + '/cancel', { method: 'POST' }).catch(() => {});
  }
  currentTaskId = null;
}

function askQuick(text) {
  document.getElementById('inputBox').value = text;
  sendMessage();
}

// ── UI 辅助 ──
function addMessage(role, content) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  // 预处理: [📄](url) → <a> 标签, 确保不依赖 marked
  div.innerHTML = '<div class="bubble">' + marked.parse(content.replace(/\[📄\]\(([^\s)]+)\)/g, '<a href="$1" target="_blank" class="pdf-link">📄</a>')) + '</div>';
  container.appendChild(div);
  scrollToBottom();
  return div;
}

function scrollToBottom() {
  const container = document.getElementById('messages');
  container.scrollTop = container.scrollHeight;
}

function showChat() { document.getElementById('messages').style.display = ''; }
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── PDF 面板（iframe 方式：浏览器原生渲染，支持原生 highlight annotation） ──
function getPdfUrl(fileId) {
  const base = window.location.origin;
  return base + '/api/pdf/' + fileId;
}

async function openPdfPanel(source) {
  const fileId = source.replace('.pdf','');
  document.getElementById('pdfPanelTitle').textContent = decodeURIComponent(fileId);
  document.getElementById('pdfPanel').classList.add('active');
  document.getElementById('pdfPanelFrame').src = getPdfUrl(fileId);
}
function closePdfPanel() {
  document.getElementById('pdfPanel').classList.remove('active');
  document.getElementById('pdfPanelFrame').src = '';
}

// ── PDF 模态弹窗 ──
async function openPdfModal(source) {
  const fileId = source.replace('.pdf','');
  document.getElementById('modalPdfTitle').textContent = decodeURIComponent(fileId);
  document.getElementById('pdfModalOverlay').classList.add('active');
  document.getElementById('modalPdfFrame').src = getPdfUrl(fileId);
}
function closePdfModal() {
  document.getElementById('pdfModalOverlay').classList.remove('active');
  document.getElementById('modalPdfFrame').src = '';
}

// ── 论文库 ──
async function openLibrary() {
  document.getElementById('libraryOverlay').classList.add('active');
  if (!papersCache) await loadPapers();
  updateFilters();
  renderPapers();
}
function closeLibrary() { document.getElementById('libraryOverlay').classList.remove('active'); }

async function loadPapers() {
  const r = await fetch('/api/papers?page_size=100');
  papersCache = await r.json();
}

function updateFilters() {
  const cats = papersCache.categories || [];
  const jf = document.getElementById('journalFilter');
  jf.innerHTML = '<option value="">所有期刊</option>' + cats.map(c => '<option value="' + c + '">' + c + '</option>').join('');

  const years = [...new Set((papersCache.papers || []).map(p => p.year).filter(Boolean))].sort((a,b) => b - a);
  const yf = document.getElementById('yearFilter');
  yf.innerHTML = '<option value="">所有年份</option>' + years.map(y => '<option value="' + y + '">' + y + '</option>').join('');
}

function filterPapers() {
  currentFilter = document.getElementById('journalFilter').value;
  currentPage = 1;
  renderPapers();
}

function pagePapers(delta) {
  currentPage = Math.max(1, currentPage + delta);
  renderPapers();
}

async function renderPapers() {
  const jf = document.getElementById('journalFilter');
  const yf = document.getElementById('yearFilter');
  const cat = jf.value;
  const yr = yf.value;

  let url = '/api/papers?page=' + currentPage + '&page_size=20';
  if (cat) url += '&category=' + encodeURIComponent(cat);
  if (yr) url += '&year=' + encodeURIComponent(yr);
  
  const r = await fetch(url);
  const data = await r.json();
  const list = document.getElementById('paperList');
  list.innerHTML = '';
  
  document.getElementById('paperCount').textContent = '共 ' + data.total + ' 篇';
  document.getElementById('pageInfo').textContent = '第 ' + data.page + ' / ' + data.total_pages + ' 页';
  document.getElementById('prevPage').disabled = data.page <= 1;
  document.getElementById('nextPage').disabled = data.page >= data.total_pages;

  for (const p of data.papers) {
    const div = document.createElement('div');
    div.className = 'paper-item';
    div.innerHTML = '<div class="journal">' + escapeHtml(p.journal) + '</div>' +
      '<div class="source">' + escapeHtml(p.source) + '</div>' +
      '<div class="preview">' + escapeHtml(p.title_preview.slice(0, 200)) + '</div>' +
      '<div class="actions">' +
      '<button class="btn-interpret" onclick="interpretPaper(\'' + p.id + '\')">🧠 解读</button>' +
      '<button class="btn-open-pdf" onclick="openPdfModal(\'' + p.source + '\')">📄 PDF</button>' +
      '</div>';
    list.appendChild(div);
  }
}

async function interpretPaper(id) {
  closeLibrary();
  // 创建一个新 session 自动触发解读
  if (!currentSessionId) {
    const r = await fetch('/api/sessions', { method: 'POST' });
    const d = await r.json();
    currentSessionId = d.id;
    localStorage.setItem('currentSession', currentSessionId);
  }
  document.getElementById('inputBox').value = '解读这篇论文';
  // 后续需要 paper_id 参数，但目前 sendMessage 不支持带 paper_id
  // 直接发送，后端会通过 session 历史中的 user 消息去搜索
  sendMessage();
}

// 点击会话中的 PDF 链接打开侧边面板（高亮已由后端写入 PDF 文件）
document.addEventListener('click', async function(e) {
  const a = e.target.closest('a[href^="/api/pdf/"]');
  if (a) {
    e.preventDefault();
    const href = a.getAttribute('href');
    const url = new URL(href, window.location.origin);
    const fileId = url.pathname.replace('/api/pdf/', '').replace('.pdf', '');
    if (e.ctrlKey || e.metaKey) {
      openPdfModal(fileId + '.pdf');
    } else {
      openPdfPanel(fileId + '.pdf');
    }
  }
});
